name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  # release.yml runs this first and only publishes if it passes.
  workflow_call:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.11"]

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install system dependencies (macOS)
      if: runner.os == 'macOS'
      run: brew install libomp

    - name: Every internal import resolves
      run: python scripts/check_imports.py src langtune

    - name: Install
      run: |
        python -m pip install --upgrade pip
        pip install -e . pytest

    - name: Package imports
      run: python -c "import langtune; print('langtune', langtune.__version__)"

    - name: API contract and TRL compatibility tests
      run: pytest -q tests/test_api_contract.py tests/test_trl_compat.py

  package:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: "3.11"
    - name: Build and check the distribution
      run: |
        python -m pip install --upgrade pip build twine
        python -m build
        twine check dist/*

  js:
    # The TypeScript client in js/ was never built by CI: a dependency bump
    # to TypeScript 7 broke its build while every check here stayed green.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: js
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: js/package-lock.json
      - run: npm ci
      - name: Build
        run: npm run build
      - name: Type-check
        run: npx tsc --noEmit -p .
      - name: Built package loads
        run: node -e "const m = require('./dist/index.js'); if (!m.FinetuneConfigSchema) throw new Error('FinetuneConfigSchema missing'); console.log(Object.keys(m))"
